# git-dev config for this repo (see workflow/assets/git-dev.data/config.yaml for every option).

# Optional. Which provider backs each tracker; defaults to mock if omitted. Read by
# scripts/git_dev_data.py (a tiny stdlib key:value reader, not full YAML: only two-space-indented
# nesting of `key: value` pairs is supported, no lists or quoted strings).
# backends:
#   version_control: github        # mock | github
#   req_tracker: github_labels     # mock | github_labels
#
# github:
#   repo: owner/name               # optional; defaults to the current directory's gh-detected repo
#   labels:
#     requirement: req             # issues with this label are the requirements
#     test: test                   # issues with this label are coverage records (each is its own testcase)
#     dev: dev                     # issues with this label become the req-tracker's "specifications" slot

backends:
  version_control: github
  req_tracker: github_labels

# Auto mode is deliberately off here: every action on this repo is real (issues, PRs, pushes).
# auto:
#   enabled: true
#   gates: plan,update
#   review: true
