# Builds the site with the shared site-kit workflow and deploys it to GitHub Pages.
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: DavideBisio/site-kit/.github/workflows/deploy-pages.yml@ef6ed2586d40a45e27228d4734d5a2abe58575d2 # v0.1.2
    with:
      site-dir: "site"
